openapi: 3.0.3
info:
  title: STAAD Report Extractor API
  version: 1.0.0
  description: |
    FastAPI service for uploading a STAAD `.std` model, queueing extraction work,
    running the selected structural-analysis backend, and polling for results.

    ANALYSIS_BACKEND=inhouse is the default; openstaad retains the licensed
    Windows oracle. In-house health does not require Bentley licensing. In-house
    station distances use metres and source units are N/METER. The analysis block
    adds backend, solver_version, validation_status and numerical diagnostics.
    This is a validation build; see docs/VALIDATION_RESULTS.md for differences.

    Runtime architecture:

    `Client → API → Queue → Worker → In-house solver or OpenSTAAD → Result`

    Extraction flows (`POST /jobs` `extraction_flow`):

    - `standard` (default, Sliding) — global absolute envelope under `result.properties`
    - `fully_unitized` — same global envelope plus per-profile blocks and `result.profiles`
    - `casement` — same standard-shaped global envelope plus a top-level signed
      `result.casement` object (`interlock`, `central_meeting`, `fixed_mullion`,
      `horizontal`, `outer`)

    Authentication is not required. `POST /jobs` uses `multipart/form-data`.
  contact:
    name: STAAD Report Extractor

servers:
  - url: http://localhost:8000
    description: Local development (default Uvicorn)

tags:
  - name: Health
    description: Process, licensing, and STAAD readiness probes
  - name: Jobs
    description: Job submission, status polling, abort, and result retrieval

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Run a readiness check
      description: |
        Select which readiness probe to run via the `check` query parameter.

        - `server` — FastAPI process and worker queue readiness (always HTTP 200;
          `healthy` may still be `false` if the worker cannot start)
        - `license` — Bentley Connection Client / licensing readiness
          (HTTP 200 if healthy, 503 if not)
        - `staad` — deeper STAAD / OpenSTAAD readiness
          (HTTP 200 if healthy, 503 if not)
      parameters:
        - name: check
          in: query
          required: false
          description: Which readiness probe to run
          schema:
            $ref: "#/components/schemas/HealthCheckName"
          example: server
      responses:
        "200":
          description: Check completed (healthy for license/staad, or any server check)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                server:
                  summary: Server readiness
                  value:
                    check: server
                    status: ok
                    healthy: true
                    checked_at: "2026-08-22T17:00:00Z"
                    message: FastAPI server is ready.
                    details:
                      queue_size: 0
                      configured_worker_count: 1
                      effective_worker_count: 1
                      active_worker_count: 1
                      allow_parallel_staad: false
                license:
                  summary: License readiness (healthy)
                  value:
                    check: license
                    status: healthy
                    healthy: true
                    checked_at: "2026-08-22T17:00:00Z"
                    message: Bentley licensing and STAAD entitlement checks passed.
                    details:
                      desktop_api_installed: true
                      connect_running: true
                      connect_logged_in: true
                      user_session_active: true
                      eula_accepted: true
                      license_service_installed: true
                      has_valid_access_key: false
                      products:
                        - product_id: 1562
                          product_name: STAAD.Pro
                          status: Ok
                          entitlement_count: 2
                staad:
                  summary: STAAD readiness (healthy)
                  value:
                    check: staad
                    status: healthy
                    healthy: true
                    checked_at: "2026-08-22T17:00:00Z"
                    message: STAAD readiness check passed.
                    details:
                      staad_executable: "C:\\Program Files\\Bentley\\Engineering\\STAAD.Pro CONNECT Edition\\STAAD\\Bentley.Staad.exe"
                      current_file: null
        "422":
          description: Invalid `check` value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "503":
          description: License or STAAD check failed (`healthy=false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                licenseUnhealthy:
                  summary: License not ready
                  value:
                    check: license
                    status: unhealthy
                    healthy: false
                    checked_at: "2026-08-22T17:00:00Z"
                    message: Bentley Connection Client is not logged in.
                    details:
                      desktop_api_installed: true
                      connect_running: true
                      connect_logged_in: false
                      user_session_active: false
                      eula_accepted: true
                      license_service_installed: true
                      has_valid_access_key: false
                      products: []
                staadUnhealthy:
                  summary: STAAD not ready
                  value:
                    check: staad
                    status: unhealthy
                    healthy: false
                    checked_at: "2026-08-22T17:00:00Z"
                    message: Unable to attach to STAAD.
                    details:
                      error_code: staad_attach_failed
                      retryable: true
                      attempts: 1
                      stage: connection
                      hint: Open STAAD manually once in this Windows session and clear any prompts.

  /jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Submit a STAAD extraction job
      description: |
        Accepts a `.std` upload, stages it under the jobs directory, and enqueues
        work for the background worker. Returns immediately with HTTP 202; the
        request path does **not** launch or attach to STAAD.

        Poll `GET /jobs/{job_id}` for progress. Call `GET /jobs/{job_id}/result`
        only when `result_ready` is `true`.

        Set `extraction_flow=casement` for Casement signed profile envelopes. The
        optional `generation_request` JSON may include `casement_profiles` to
        override geometry classification.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
            encoding:
              std_file:
                contentType: application/octet-stream
              generation_request:
                contentType: application/json
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreateResponse"
              example:
                job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                status: queued
                message: Job accepted.
        "413":
          description: Uploaded file exceeds `STAAD_API_MAX_UPLOAD_BYTES` (default 50 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailEnvelope"
              example:
                detail:
                  error_code: file_too_large
                  message: Upload exceeds maximum allowed size.
                  retryable: false
        "422":
          description: Validation failed (file type, timeout, retries, flow, or path)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorDetailEnvelope"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidInputFile:
                  summary: Not a .std file
                  value:
                    detail:
                      error_code: invalid_input_file
                      message: Only .std file upload is supported.
                      retryable: false
                invalidTimeout:
                  summary: timeout_seconds <= 0
                  value:
                    detail:
                      error_code: invalid_timeout
                      message: timeout_seconds must be > 0
                      retryable: false
                invalidMaxRetries:
                  summary: max_retries < 0
                  value:
                    detail:
                      error_code: invalid_max_retries
                      message: max_retries must be >= 0
                      retryable: false
                invalidRetryDelay:
                  summary: retry_delay_seconds < 1
                  value:
                    detail:
                      error_code: invalid_retry_delay
                      message: retry_delay_seconds must be >= 1
                      retryable: false
                invalidExtractionFlow:
                  summary: Unknown extraction_flow
                  value:
                    detail:
                      error_code: invalid_extraction_flow
                      message: extraction_flow must be 'standard', 'fully_unitized', or 'casement'
                      retryable: false
                invalidStaadproPath:
                  summary: staadpro_path is not an existing file
                  value:
                    detail:
                      error_code: invalid_staadpro_path
                      message: "STAAD executable not found: C:\\missing\\Bentley.Staad.exe"
                      retryable: false

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJobStatus
      summary: Get job status and progress
      description: |
        Poll this endpoint to drive a UI progress bar.

        - Continue while `status` is `queued` or `running`
        - Stop when `status` is `succeeded`, `failed`, or `canceled`
        - Call the result endpoint only when `result_ready` is `true`

        Non-terminal jobs cap `progress_percent` below 100. Terminal jobs always
        return 100.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
              examples:
                queued:
                  summary: Queued, not started
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: queued
                    progress_percent: 0
                    message: Job is not started yet.
                    attempts: 0
                    max_attempts: 3
                    created_at: "2026-08-22T17:00:00Z"
                    started_at: null
                    finished_at: null
                    result_ready: false
                    error: null
                    duration_seconds: null
                    working_directory: "C:\\STAADJobs\\3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11"
                    cleanup_performed: false
                running:
                  summary: Extraction in progress
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: running
                    progress_percent: 55
                    message: Running STAAD analysis.
                    attempts: 1
                    max_attempts: 3
                    created_at: "2026-08-22T17:00:00Z"
                    started_at: "2026-08-22T17:00:02Z"
                    finished_at: null
                    result_ready: false
                    error: null
                    duration_seconds: null
                    working_directory: "C:\\STAADJobs\\3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11"
                    cleanup_performed: false
                succeeded:
                  summary: Ready for result fetch
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: succeeded
                    progress_percent: 100
                    message: Extraction completed.
                    attempts: 1
                    max_attempts: 3
                    created_at: "2026-08-22T17:00:00Z"
                    started_at: "2026-08-22T17:00:02Z"
                    finished_at: "2026-08-22T17:01:15Z"
                    result_ready: true
                    error: null
                    duration_seconds: 73.2
                    working_directory: "C:\\STAADJobs\\3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11"
                    cleanup_performed: true
        "404":
          description: Unknown job id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailEnvelope"
              example:
                detail:
                  error_code: job_not_found
                  message: "Job not found: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11"
                  retryable: false

  /jobs/{job_id}/abort:
    post:
      tags: [Jobs]
      operationId: abortJob
      summary: Abort a queued or running job
      description: |
        Cancels **queued** jobs immediately, or force-stops a **running** STAAD job
        by killing the extractor process tree and related STAAD processes so the
        worker can advance to the next queued request.

        Already-terminal jobs return their current status with an informational message.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Abort accepted, or job already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAbortResponse"
              examples:
                canceledQueued:
                  summary: Queued job canceled
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: canceled
                    message: Job canceled before execution.
                canceledRunning:
                  summary: Running job force-stopped
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: canceled
                    message: Job canceled during execution.
                alreadySucceeded:
                  summary: Already finished
                  value:
                    job_id: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11
                    status: succeeded
                    message: Job already succeeded.
        "404":
          description: Unknown job id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailEnvelope"
              example:
                detail:
                  error_code: job_not_found
                  message: "Job not found: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11"
                  retryable: false

  /jobs/{job_id}/result:
    get:
      tags: [Jobs]
      operationId: getJobResult
      summary: Get job result or in-progress / failure payload
      description: |
        Response shape depends on job status:

        | Status | HTTP | Body |
        |--------|------|------|
        | `queued` / `running` | 200 | In-progress stub |
        | `canceled` | 200 | Canceled stub |
        | `succeeded` | 200 | Full extraction `result` |
        | `failed` | 500 | Failure detail envelope |
        | unknown | 404 | `job_not_found` |

        Prefer polling `GET /jobs/{job_id}` and only calling this endpoint when
        `result_ready` is `true`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: In-progress, canceled, or succeeded payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JobResultInProgress"
                  - $ref: "#/components/schemas/JobResultCanceled"
                  - $ref: "#/components/schemas/JobResultSucceeded"
