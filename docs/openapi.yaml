components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: Job identifier returned by `POST /jobs`
      schema:
        type: string
        format: uuid
      example: 3f8c2a1e-9b4d-4e6a-8c1f-2a7b9d0e5f11

  schemas:
    # ---------------------------------------------------------------------------
    # Enums / shared primitives
    # ---------------------------------------------------------------------------
    JobStatus:
      type: string
      description: Job lifecycle state
      enum: [queued, running, succeeded, failed, canceled]

    HealthCheckName:
      type: string
      description: Readiness probe selector for `GET /health`
      enum: [server, license, staad]
      default: server

    ExtractionFlow:
      type: string
      description: |
        Extraction mode for `POST /jobs`.

        - `standard` — Sliding; global absolute envelope only
        - `fully_unitized` — global envelope plus per-profile `properties.*` and `profiles`
        - `casement` — standard-shaped global envelope plus signed `result.casement`

        Accepted aliases (normalized server-side):
        `unitized`, `fullyunitized`, and hyphenated forms map to `fully_unitized`.
        Hyphenated `casement` forms map to `casement`.
      enum: [standard, fully_unitized, casement]
      default: standard

    # ---------------------------------------------------------------------------
    # Error envelopes
    # ---------------------------------------------------------------------------
    ApiErrorCode:
      type: string
      description: Machine-readable error code
      examples:
        - job_not_found
        - file_too_large
        - invalid_input_file
        - invalid_timeout
        - invalid_max_retries
        - invalid_retry_delay
        - invalid_extraction_flow
        - invalid_staadpro_path
        - staad_attach_failed
        - job_failed

    ErrorBody:
      type: object
      description: Common application error object returned inside `detail`
      required: [error_code, message]
      properties:
        error_code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          description: Human-readable error summary
        retryable:
          type: boolean
          description: Whether the client may safely retry the same operation
          default: false

    ErrorDetailEnvelope:
      type: object
      description: FastAPI `HTTPException` wrapper used by most handler errors
      required: [detail]
      properties:
        detail:
          $ref: "#/components/schemas/ErrorBody"

    ValidationErrorItem:
      type: object
      description: Starlette / Pydantic validation error entry
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          description: Location of the invalid field
        msg:
          type: string
        type:
          type: string
        input:
          description: Rejected input value (when available)
        ctx:
          type: object
          additionalProperties: true

    ValidationErrorResponse:
      type: object
      description: Framework validation failure (HTTP 422)
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    ApiError:
      type: object
      description: |
        Structured failure attached to job status (and sanitized for API clients).
        `last_stderr_excerpt` is always stripped to `null` in HTTP responses.
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
          default: false
        attempts:
          type: integer
          minimum: 0
          default: 0
        stage:
          type: string
          nullable: true
          description: Failure stage, e.g. `connection` or `execution`
        hint:
          type: string
          nullable: true
          description: Optional remediation guidance for operators
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Sanitized subset of error metadata. Typical safe keys:
            `error_code`, `retryable`, `attempts`, `stage`, `hint`.
        last_stderr_excerpt:
          type: string
          nullable: true
          description: Always `null` in public API responses (stripped server-side)

    # ---------------------------------------------------------------------------
    # Health
    # ---------------------------------------------------------------------------
    HealthResponse:
      type: object
      description: Readiness check result
      required: [check, status, healthy, checked_at, message]
      properties:
        check:
          $ref: "#/components/schemas/HealthCheckName"
        status:
          type: string
          description: Short status token (`ok`, `healthy`, `unhealthy`, `error`, …)
          example: ok
        healthy:
          type: boolean
          description: Overall pass/fail for the selected check
        checked_at:
          type: string
          format: date-time
          description: UTC timestamp when the check ran
        message:
          type: string
          description: Human-readable summary
        details:
          description: Check-specific payload (shape depends on `check`)
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ServerHealthDetails"
            - $ref: "#/components/schemas/LicenseHealthDetails"
            - $ref: "#/components/schemas/StaadHealthDetails"
            - $ref: "#/components/schemas/HealthFailureDetails"

    ServerHealthDetails:
      type: object
      description: "`check=server` details"
      properties:
        queue_size:
          type: integer
          nullable: true
          description: Current in-memory job queue depth
        configured_worker_count:
          type: integer
          nullable: true
          description: Value of `STAAD_WORKER_COUNT`
        effective_worker_count:
          type: integer
          nullable: true
          description: Workers actually started (respects `ALLOW_PARALLEL_STAAD`)
        active_worker_count:
          type: integer
          nullable: true
          description: Worker tasks that have not finished
        allow_parallel_staad:
          type: boolean
          nullable: true
          description: Value of `ALLOW_PARALLEL_STAAD`

    LicenseProductDetail:
      type: object
      properties:
        product_id:
          type: integer
          description: Bentley product id (e.g. 1562 for STAAD.Pro)
        product_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: License status string (e.g. `Ok`, `Trial`)
        entitlement_count:
          type: integer
          nullable: true

    LicenseHealthDetails:
      type: object
      description: "`check=license` success details"
      properties:
        desktop_api_installed:
          type: boolean
        connect_running:
          type: boolean
        connect_logged_in:
          type: boolean
        user_session_active:
          type: boolean
        eula_accepted:
          type: boolean
        license_service_installed:
          type: boolean
        has_valid_access_key:
          type: boolean
        products:
          type: array
          items:
            $ref: "#/components/schemas/LicenseProductDetail"

    StaadHealthDetails:
      type: object
      description: "`check=staad` success details"
      properties:
        staad_executable:
          type: string
          nullable: true
          description: Resolved STAAD executable path
        current_file:
          type: string
          nullable: true
          description: Currently open STAAD model path, if any

    HealthFailureDetails:
      type: object
      description: Failure / error details for license or STAAD checks
      properties:
        error_code:
          type: string
        retryable:
          type: boolean
        attempts:
          type: integer
        stage:
          type: string
        hint:
          type: string
        exception_type:
          type: string
        message:
          type: string

    # ---------------------------------------------------------------------------
    # Job create (multipart)
    # ---------------------------------------------------------------------------
    JobCreateRequest:
      type: object
      required: [std_file]
      properties:
        std_file:
          type: string
          format: binary
          description: Required STAAD model upload. Filename must end with `.std`.
        staadpro_path:
          type: string
          nullable: true
          description: |
            Optional legacy absolute path to the STAAD executable. Accepted for
            backward compatibility; if provided, the path must exist as a file.
          example: "C:\\Program Files\\Bentley\\Engineering\\STAAD.Pro CONNECT Edition\\STAAD\\Bentley.Staad.exe"
        timeout_seconds:
          type: integer
          description: Per-attempt STAAD/extraction timeout in seconds. Must be `> 0`.
          default: 180
          exclusiveMinimum: 0
          example: 180
        max_retries:
          type: integer
          description: |
            Number of retries after the first attempt. Total attempts =
            `max_retries + 1`. Must be `>= 0`. Default from `STAAD_API_MAX_RETRIES`.
          default: 2
          minimum: 0
          example: 2
        retry_delay_seconds:
          type: integer
          description: |
            Delay between attempts in seconds. Must be `>= 1`. Default from
            `STAAD_API_RETRY_DELAY_SECONDS`.
          default: 20
          minimum: 1
          example: 20
        extraction_flow:
          type: string
          description: |
            Extraction mode. Prefer `standard`, `fully_unitized`, or `casement`.
            Aliases `unitized` / `fullyunitized` (and hyphen forms) are accepted for unitized.
            Hyphenated `casement` maps to `casement`.
          default: standard
          example: standard
        generation_request:
          type: string
          format: binary
          description: |
            Optional JSON file. For Fully Unitized: panel geometry and optional flow
            override. For Casement: optional flow override and `casement_profiles`
            member-id map. See `GenerationRequest`.

    GenerationRequest:
      type: object
      description: |
        Optional JSON uploaded as `generation_request` on `POST /jobs`.
        Parsed by the extractor (not validated as a FastAPI/Pydantic model).
      properties:
        panels:
          type: array
          description: Panel height segments used for head/sill/transom/stack classification
          items:
            $ref: "#/components/schemas/GenerationRequestPanel"
        flowType:
          type: string
          description: Flow override (camelCase). May force `fully_unitized` or `casement`.
        flow_type:
          type: string
          description: Flow override (snake_case alias of `flowType`)
        extractionFlow:
          type: string
          description: Flow override (camelCase alias)
        extraction_flow:
          type: string
          description: Flow override (snake_case alias)
        casement_profiles:
          allOf:
            - $ref: "#/components/schemas/CasementProfileMemberMap"
          description: |
            Optional Casement member-id map (snake_case). When present with at least
            one valid id, overrides geometry-based classification. Unknown member
            ids are dropped. Duplicate ids are kept on the first matching profile
            (`interlock`, then `central_meeting`, `fixed_mullion`, `horizontal`, `outer`).
        casementProfiles:
          allOf:
            - $ref: "#/components/schemas/CasementProfileMemberMap"
          description: Optional Casement member-id map (camelCase alias of `casement_profiles`)
      example:
        extraction_flow: casement
        casement_profiles:
          interlock: [22, 26]
          central_meeting: [24]
          fixed_mullion: [21, 23, 25]
          horizontal: [47, 48, 49, 50]
          outer: [1, 2, 3]

    GenerationRequestPanel:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          description: Ordered height segments (numeric) composing one panel
          items:
            type: number
          minItems: 1
          example: [1200, 1800, 900]

    JobCreateResponse:
      type: object
      required: [job_id, status, message]
      properties:
        job_id:
          type: string
          format: uuid
          description: Unique job identifier for status / result / abort calls
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: Always `queued` on successful acceptance
          example: queued
        message:
          type: string
          default: Job accepted.

    # ---------------------------------------------------------------------------
    # Job status / abort
    # ---------------------------------------------------------------------------
    JobStatusResponse:
      type: object
      required:
        - job_id
        - status
        - progress_percent
        - message
        - attempts
        - max_attempts
        - created_at
        - result_ready
        - cleanup_performed
      properties:
        job_id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            UI progress value. Non-terminal jobs are capped below 100;
            terminal jobs always return 100.
        message:
          type: string
          description: User-facing status text for display next to a progress bar
        attempts:
          type: integer
          minimum: 0
          description: Completed / in-flight attempt count
        max_attempts:
          type: integer
          minimum: 0
          description: "`max_retries + 1` from job submission"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result_ready:
          type: boolean
          description: "`true` only when `status` is `succeeded`"
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
          nullable: true
          description: Present when the job failed (sanitized)
        duration_seconds:
          type: number
          format: float
          nullable: true
          description: Wall-clock duration once finished
        working_directory:
          type: string
          nullable: true
          description: Job working folder path on the API host
        cleanup_performed:
          type: boolean
          description: Whether post-job cleanup has run

    JobAbortResponse:
      type: object
      required: [job_id, status, message]
      properties:
        job_id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        message:
          type: string
          description: Outcome message (`Job canceled before execution.` or `Job already {status}.`)

    # ---------------------------------------------------------------------------
    # Job result response variants
    # ---------------------------------------------------------------------------
    JobResultInProgress:
      type: object
      description: Returned while status is `queued` or `running`
      required: [job_id, status, message]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running]
        message:
          type: string
          example: Job in progress.
        working_directory:
          type: string
          nullable: true

    JobResultCanceled:
      type: object
      description: Returned when status is `canceled`
      required: [job_id, status, message]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [canceled]
        message:
          type: string
          example: Job canceled before execution.
        working_directory:
          type: string
          nullable: true
        cleanup_performed:
          type: boolean

    JobResultSucceeded:
      type: object
      description: Successful extraction response
      required: [job_id, status, result]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [succeeded]
        duration_seconds:
          type: number
          format: float
          nullable: true
        working_directory:
          type: string
          nullable: true
        cleanup_performed:
          type: boolean
        attempts:
          type: integer
        max_attempts:
          type: integer
        result:
          $ref: "#/components/schemas/ExtractionResult"

    JobResultFailed:
      type: object
      description: Body placed under `detail` when result fetch returns HTTP 500
      required: [job_id, status, error, error_code]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [failed]
        error:
          type: string
          description: Human-readable failure message
        error_code:
          type: string
        retryable:
          type: boolean
        stage:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        cleanup_performed:
          type: boolean
        duration_seconds:
          type: number
          format: float
          nullable: true
        working_directory:
          type: string
          nullable: true
        attempts:
          type: integer

    JobResultFailedDetailEnvelope:
      type: object
      required: [detail]
      properties:
        detail:
          $ref: "#/components/schemas/JobResultFailed"

    # ---------------------------------------------------------------------------
    # Extraction result payload (succeeded job `result` field)
    # ---------------------------------------------------------------------------
    ExtractionResult:
      type: object
      description: |
        Extractor output embedded as `result` on a succeeded job.
        Built by `staad-max-extractor/extractor.py` (not a Pydantic response model).
      required: [file, analysis, units, properties]
      properties:
        file:
          type: string
          description: Absolute path of the processed `.std` on the API host
        analysis:
          $ref: "#/components/schemas/AnalysisSettings"
        units:
          $ref: "#/components/schemas/UnitsBlock"
        properties:
          $ref: "#/components/schemas/PropertiesBlock"
        profiles:
          allOf:
            - $ref: "#/components/schemas/ProfilesBlock"
          description: Present only for `extraction_flow=fully_unitized`
        casement:
          allOf:
            - $ref: "#/components/schemas/CasementBlock"
          description: |
            Present only for `extraction_flow=casement`. Not included for
            `standard` or `fully_unitized` responses. Sliding/standard `properties`
            remain absolute magnitudes; Casement profile metrics under this object
            are signed `max`/`min`. If Casement extraction fails after analysis,
            this object is still returned with empty `member_ids` and null envelopes.

    AnalysisSettings:
      type: object
      required: [load_case_mode, load_cases, moment_mode, include_combinations]
      properties:
        load_case_mode:
          type: string
          description: How load cases were selected (e.g. `all`)
          example: all
        load_cases:
          type: array
          items:
            type: integer
          description: Load case ids included in the envelope
        moment_mode:
          type: string
          description: Moment extraction mode (e.g. `internal-envelope`)
          example: internal-envelope
        include_combinations:
          type: boolean
          description: Whether combination cases were included

    UnitTriplet:
      type: object
      required: [force, length, moment]
      properties:
        force:
          type: string
          example: kN
        length:
          type: string
          example: mm
        moment:
          type: string
          example: kN-m

    UnitsBlock:
      type: object
      required: [output, staad_detected, file_detected]
      properties:
        output:
          allOf:
            - $ref: "#/components/schemas/UnitTriplet"
          description: Units used in the returned engineering values
        staad_detected:
          allOf:
            - $ref: "#/components/schemas/UnitTriplet"
          description: Units detected from the live STAAD session
        file_detected:
          allOf:
            - $ref: "#/components/schemas/UnitTriplet"
          description: Units detected from the `.std` file text

    EngineeringResult:
      type: object
      description: |
        Cleaned engineering extreme / companion value. Null fields are omitted.
        Units for the parent quantity live on the enclosing block (`unit`), not here.
      properties:
        value:
          type: number
          format: double
        axis:
          type: string
          description: Force/moment axis (`MZ`, `MY`, `FY`, `FZ`, `FX`, …)
        direction:
          type: string
          description: Displacement direction when applicable
        member_id:
          type: integer
        member_type:
          type: string
        node_id:
          type: integer
        source:
          type: string
        location:
          type: string
        station:
          type: number
          format: double
        station_unit:
          type: string
        load_case:
          type: integer
        load_case_name:
          type: string
        governing_end:
          type: string
        governing_station:
          type: number
          format: double
        reference_major_value:
          type: number
          format: double
          description: Companion field — major value at the governing point
        reference_major_load_case:
          type: integer
          description: Companion field — major load case reference
        governing_load_case:
          type: integer
          description: Companion field — governing load case for minor shear at major point
        governing_load_case_name:
          type: string

    BendingMomentMinor:
      type: object
      properties:
        axis:
          type: string
          example: MY
        max:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: Maximum minor-direction My
        at_major_governing_point:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: My at the governing Mz point (includes `reference_major_*`)

    BendingMomentBlock:
      type: object
      required: [unit, major]
      properties:
        unit:
          type: string
          example: kN-m
        major:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: Maximum major-direction Mz (`axis` typically `MZ`)
        minor:
          allOf:
            - $ref: "#/components/schemas/BendingMomentMinor"
          description: |
            Present on global / mullion envelopes. Omitted for horizontal
            fully-unitized profile groups (`head`, `sill`, `transom`, `stack`).

    ShearForceMinor:
      type: object
      properties:
        axis:
          type: string
          example: FZ
        max_on_mullions:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: Maximum minor-direction Fz from vertical Mullion members only
        at_major_governing_point:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: |
            Fz at the fixed point where major Fy governs. May include
            `governing_load_case`, `governing_load_case_name`, and `reference_major_*`.

    ShearForceBlock:
      type: object
      required: [unit, major]
      properties:
        unit:
          type: string
          example: kN
        major:
          allOf:
            - $ref: "#/components/schemas/EngineeringResult"
          description: Maximum major-direction Fy (`axis` typically `FY`)
        minor:
          allOf:
            - $ref: "#/components/schemas/ShearForceMinor"
          description: Present on global / mullion envelopes; omitted for horizontal profile groups

    AxialForceBlock:
      type: object
      description: |
        Axial envelope from inner vertical members only; peripheral/outer frame
        verticals at the assembly min/max horizontal bounds are excluded. `unit`
        plus engineering result fields.
      required: [unit]
      properties:
        unit:
          type: string
          example: kN
        value:
          type: number
          format: double
        axis:
          type: string
          example: FX
        member_id:
          type: integer
        member_type:
          type: string
        node_id:
          type: integer
        source:
          type: string
        location:
          type: string
        station:
          type: number
          format: double
        station_unit:
          type: string
        load_case:
          type: integer
        load_case_name:
          type: string
        governing_end:
          type: string
        governing_station:
          type: number
          format: double

    DisplacementBlock:
      type: object
      description: Displacement envelope; `unit` plus engineering result fields
      required: [unit]
      properties:
        unit:
          type: string
          example: mm
        value:
          type: number
          format: double
        direction:
          type: string
        member_id:
          type: integer
        member_type:
          type: string
        node_id:
          type: integer
        source:
          type: string
        location:
          type: string
        station:
          type: number
          format: double
        station_unit:
          type: string
        load_case:
          type: integer
        load_case_name:
          type: string
        governing_end:
          type: string
        governing_station:
          type: number
          format: double

    PropertyEnvelope:
      type: object
      description: Grouped engineering envelope for one member set
      required: [bending_moment, shear_force, axial_force, displacement]
      properties:
        bending_moment:
          $ref: "#/components/schemas/BendingMomentBlock"
        shear_force:
          $ref: "#/components/schemas/ShearForceBlock"
        axial_force:
          $ref: "#/components/schemas/AxialForceBlock"
        displacement:
          $ref: "#/components/schemas/DisplacementBlock"

    PropertiesBlock:
      allOf:
        - $ref: "#/components/schemas/PropertyEnvelope"
        - type: object
          description: |
            Top-level `properties` is always the **global** envelope across all members.

            For `fully_unitized`, additional keys are included:
            - `global` — mirror of the top-level global envelope
            - `mullion`, `head`, `sill`, `transom`, `stack` — per-profile envelopes
              (omitted when a group has no members). Only `mullion` includes minor axes.

            For `casement`, this global envelope is unchanged (absolute magnitudes).
            Signed per-profile envelopes live under `result.casement`, not here.
          properties:
            global:
              $ref: "#/components/schemas/PropertyEnvelope"
            mullion:
              $ref: "#/components/schemas/PropertyEnvelope"
            head:
              $ref: "#/components/schemas/PropertyEnvelope"
            sill:
              $ref: "#/components/schemas/PropertyEnvelope"
            transom:
              $ref: "#/components/schemas/PropertyEnvelope"
            stack:
              $ref: "#/components/schemas/PropertyEnvelope"

    ProfileMemberCounts:
      type: object
      description: Member counts per classified profile group
      additionalProperties:
        type: integer
        minimum: 0
      properties:
        mullion:
          type: integer
        head:
          type: integer
        sill:
          type: integer
        transom:
          type: integer
        stack:
          type: integer

    ProfilesBlock:
      type: object
      description: Fully unitized profile metadata (`result.profiles`)
      required: [extraction_flow, member_counts]
      properties:
        extraction_flow:
          type: string
          enum: [fully_unitized]
        member_counts:
          $ref: "#/components/schemas/ProfileMemberCounts"

    CasementGoverningResult:
      type: object
      nullable: true
      description: |
        One signed governing sample. `null` when the profile has no samples for
        that metric. Unlike the global `properties` envelope, values keep algebraic
        sign (`max` is most positive, `min` is most negative). Null fields are omitted.
      properties:
        value:
          type: number
          format: double
          description: Signed engineering value in the parent metric `unit`
        member_id:
          type: integer
        node_id:
          type: integer
          description: Present on nodal displacement samples
        station:
          type: number
          format: double
          description: Member station (0 start / 1 end for forces; sampled station for BM/DF)
        location:
          type: string
          description: "`start` / `end` for forces; `member-minimum` / `member-maximum` for BM"
        load_case:
          type: integer
        load_case_name:
          type: string
        axis:
          type: string
          description: "`MZ` for BM, `FY` for SF, `FX` for AF"
        direction:
          type: string
          description: Displacement direction, typically `RESULTANT`

    CasementMetricEnvelope:
      type: object
      required: [unit, max, min]
      description: Signed max/min envelope for one Casement metric
      properties:
        unit:
          type: string
          description: "`kN-m` for BM, `kN` for SF/AF, `mm` for DF"
          example: kN-m
        max:
          $ref: "#/components/schemas/CasementGoverningResult"
        min:
          $ref: "#/components/schemas/CasementGoverningResult"

    CasementProfileBlock:
      type: object
      required: [member_ids, bm, sf, af, df]
      description: Signed envelopes for one Casement profile group
      properties:
        member_ids:
          type: array
          items:
            type: integer
          description: Classified STAAD member ids for this profile (disjoint across profiles)
        bm:
          allOf:
            - $ref: "#/components/schemas/CasementMetricEnvelope"
          description: Signed major-axis bending (`MZ`) from the member internal moment envelope
        sf:
          allOf:
            - $ref: "#/components/schemas/CasementMetricEnvelope"
          description: Signed major-axis shear (`FY`) from member end forces
        af:
          allOf:
            - $ref: "#/components/schemas/CasementMetricEnvelope"
          description: Signed axial force (`FX`) from member end forces
        df:
          allOf:
            - $ref: "#/components/schemas/CasementMetricEnvelope"
          description: |
            Signed RESULTANT displacement. Vertical profiles prefer member-chord
            intermediate deflection so shared junction motion does not dominate;
            exclusive nodal RESULTANT is still included. `horizontal` also includes
            absolute nodal RESULTANT at shared junctions.

    CasementProfileMemberMap:
      type: object
      description: |
        Optional request-supplied Casement member-id lists. Any subset of keys may
        be present. Values are integer STAAD member ids.
      properties:
        interlock:
          type: array
          items:
            type: integer
        central_meeting:
          type: array
          items:
            type: integer
        fixed_mullion:
          type: array
          items:
            type: integer
        horizontal:
          type: array
          items:
            type: integer
        outer:
          type: array
          items:
            type: integer

    CasementProfiles:
      type: object
      description: |
        Always includes all five profile keys. Geometry classification (when no
        request map is supplied): outer frame at bounding min/max X and Y;
        remaining interior horizontals → `horizontal`; interior verticals below the
        transom line → `fixed_mullion`; above-transom median X-column →
        `central_meeting`; remaining above-transom verticals → `interlock`.
      required: [interlock, central_meeting, fixed_mullion, horizontal, outer]
      properties:
        interlock:
          $ref: "#/components/schemas/CasementProfileBlock"
        central_meeting:
          $ref: "#/components/schemas/CasementProfileBlock"
        fixed_mullion:
          $ref: "#/components/schemas/CasementProfileBlock"
        horizontal:
          $ref: "#/components/schemas/CasementProfileBlock"
        outer:
          $ref: "#/components/schemas/CasementProfileBlock"

    CasementBlock:
      type: object
      description: |
        Casement profile envelopes (`result.casement`). Absent for `standard` and
        `fully_unitized`. Present (possibly empty) whenever `extraction_flow=casement`.
      required: [extraction_flow, profiles]
      properties:
        extraction_flow:
          type: string
          enum: [casement]
        profiles:
          $ref: "#/components/schemas/CasementProfiles"
